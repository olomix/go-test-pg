name: Test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        go-version:
        - "1.19"
        - "1.20"
        - "1.21"
        - "1.22"
        - "1.23"
        - "1.24"
        - "1.25"
    runs-on: ubuntu-latest
    env:
      PGPASSWORD: pgpwd
      PGHOST: localhost
      PGUSER: postgres
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: Unit Tests
        run: go test -v -race -timeout=60s ./...
    services:
      postgres:
        image: postgres:14.2
        env:
          POSTGRES_PASSWORD: pgpwd
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
